[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "search-algorithms"
version = "0.1.0"
description = "Generalized graph search (BFS/UCS/A*) with Contraction Hierarchies and real-world OpenStreetMap routing"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Girwan Dhakal" }]
keywords = ["search", "pathfinding", "astar", "bfs", "ucs", "contraction-hierarchies", "openstreetmap", "routing"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "networkx>=3.0",
]

[project.optional-dependencies]
osm = [
    "osmnx>=2.0",
    "scikit-learn>=1.3",
]
viz = [
    "matplotlib>=3.7",
]
dev = [
    "pytest>=7.4",
]
all = [
    "osmnx>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "pytest>=7.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]
